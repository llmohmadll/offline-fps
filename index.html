<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>یار هوشمند</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

html,body{
margin:0;
width:100%;
height:100%;
background:#0b1020;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif
}

body{
display:flex;
justify-content:center
}

.app{
width:100%;
max-width:700px;
height:100%;
display:flex;
flex-direction:column;
background:#111827
}

header{
padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
display:flex;
align-items:center;
gap:10px;
border-bottom:1px solid #263044;
background:#151c2d
}

.avatar{
width:44px;
height:44px;
border-radius:50%;
display:grid;
place-items:center;
background:#6d5dfc;
font-size:22px
}

.title{
font-size:19px;
font-weight:800
}

.sub{
font-size:12px;
color:#9ca3af;
margin-top:3px
}

.status{
margin-right:auto;
display:flex;
align-items:center;
gap:6px;
color:#86efac;
font-size:12px
}

.dot{
width:8px;
height:8px;
border-radius:50%;
background:#22c55e
}

.chat{
flex:1;
overflow-y:auto;
padding:18px 14px 12px
}

.welcome{
text-align:center;
color:#9ca3af;
margin:14px 0 18px
}

.big{
font-size:42px;
margin-bottom:8px
}

.quick{
display:flex;
gap:8px;
flex-wrap:wrap;
justify-content:center;
margin-bottom:16px
}

.quick button{
border:1px solid #303b55;
background:#182238;
color:#dbeafe;
border-radius:18px;
padding:8px 12px;
font-size:13px
}

.msg{
display:flex;
margin:11px 0
}

.msg.user{
justify-content:flex-start
}

.msg.ai{
justify-content:flex-end
}

.bubble{
max-width:84%;
padding:11px 14px;
border-radius:18px;
line-height:1.8;
font-size:15px;
white-space:pre-wrap;
word-break:break-word
}

.user .bubble{
background:#334155;
border-bottom-right-radius:5px
}

.ai .bubble{
background:#4f46e5;
border-bottom-left-radius:5px
}

.typing{
opacity:.75
}
</style>
</head>
<body>

<div class="app">

<header>
<div class="avatar">✦</div>

<div>
<div class="title">یار هوشمند</div>
<div class="sub">دستیار شخصی شما</div>
</div>

<div class="status">
<span class="dot"></span>
آنلاین
</div>
</header>

<main class="chat" id="chat">

<div class="welcome">
<div class="big">🤖</div>
<div>سلام! من یار هوشمندم. هر چیزی می‌خوای بپرس.</div>
</div>

<div class="quick">

<button onclick="quickAsk('سلام! خودت را معرفی کن')">
معرفی خودت
</button>

<button onclick="quickAsk('یک ایده خوب برای امروز بده')">
ایده بده
</button>

<button onclick="quickAsk('به من در برنامه‌ریزی کمک کن')">
برنامه‌ریزی
</button>

</div>

</main>
<div class="composer">

<button class="btn mic" id="mic">🎙️</button>

<textarea class="input" id="input" rows="1" placeholder="پیامت را بنویس..."></textarea>

<button class="btn send" id="send">➤</button>

</div>

<div class="small">
پیام‌ها برای پاسخ‌گویی به هوش مصنوعی ارسال می‌شوند.
</div>

</div>

<script>
const API_URL="https://yar-hoshmand.xagxorian.workers.dev/chat";

const chat=document.getElementById("chat");
const input=document.getElementById("input");
const send=document.getElementById("send");
const mic=document.getElementById("mic");

function addMessage(text,type){
const row=document.createElement("div");
row.className="msg "+type;

const bubble=document.createElement("div");
bubble.className="bubble";
bubble.textContent=text;

row.appendChild(bubble);
chat.appendChild(row);
chat.scrollTop=chat.scrollHeight;

return bubble;
}

async function sendMessage(){

const message=input.value.trim();
if(!message)return;

input.value="";
input.style.height="48px";

addMessage(message,"user");

send.disabled=true;

const bubble=addMessage("در حال فکر کردن...","ai typing");

try{

const res=await fetch(API_URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message})
});

const data=await res.json().catch(()=>({}));

if(!res.ok){
throw new Error(data.error||"خطا در ارتباط با سرور");
}

bubble.classList.remove("typing");
bubble.textContent=data.reply||"پاسخی دریافت نشد.";

}catch(e){

bubble.classList.remove("typing");
bubble.textContent="❌ "+(e.message||"ارتباط برقرار نشد.");

}finally{

send.disabled=false;
input.focus();

}
}

function quickAsk(text){
input.value=text;
sendMessage();
}

send.addEventListener("click",sendMessage);

input.addEventListener("keydown",e=>{
if(e.key==="Enter"&&!e.shiftKey){
e.preventDefault();
sendMessage();
}
});

input.addEventListener("input",()=>{
input.style.height="48px";
input.style.height=Math.min(input.scrollHeight,140)+"px";
});

const SpeechRecognition=
window.SpeechRecognition||window.webkitSpeechRecognition;

if(SpeechRecognition){

const rec=new SpeechRecognition();

rec.lang="fa-IR";
rec.interimResults=false;
rec.continuous=false;

mic.addEventListener("click",()=>{
try{
rec.start();
mic.textContent="🔴";
}catch{}
});

rec.onresult=e=>{
input.value=e.results[0][0].transcript;
input.dispatchEvent(new Event("input"));
};

rec.onend=()=>mic.textContent="🎙️";
rec.onerror=()=>mic.textContent="🎙️";

}else{
mic.style.opacity=".45";
}
</script>

</body>
</html>
